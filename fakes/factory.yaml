# Fake behavior for graphs/factory.yaml. It shows parallel work (store and api run
# at the same time), a retry (api fails once), and both gates.
default:
  duration: 3s

nodes:
  standards:
    duration: 2s
    logs:
      - render AGENTS.md (ponytail, go 1.27 guidelines, orwell)
      - write .factory/standards/lock.json

  architect:
    duration: 6s
    logs:
      - read spec.md
      - write internal/store/store.go interfaces
      - write internal/api/api.go interfaces
      - write acceptance tests (12)
      - red before green - 12 of 12 fail on stubs

  plan:
    duration: 4s
    logs:
      - split the contract into packages
      - check write scopes do not overlap
    emit:
      - id: pkg-store
        title: internal/store
        kind: agent
        retries: 2
      - id: pkg-api
        title: internal/api
        kind: agent
        retries: 2
      - id: cmd-cli
        title: cmd/cli
        kind: agent
        retries: 2
        deps: [pkg-store, pkg-api]

  pkg-store:
    duration: 7s
    logs:
      - implement Store.Put and Store.Get
      - go test ./internal/store - ok
      - go fix -diff - clean

  pkg-api:
    duration: 5s
    fail_attempts: 1
    error: "check failed: TestParseQuery/empty_input: got nil error, want ErrEmpty"
    logs:
      - implement ParseQuery
      - go test ./internal/api

  cmd-cli:
    duration: 5s
    logs:
      - wire flags to store and api
      - go build ./... - ok

  verify:
    duration: 3s
    logs:
      - go test -race ./... - ok
      - go.mod says go 1.27, no unapproved modules

  review:
    duration: 4s
    logs:
      - "What this change does: a CLI that stores and queries records."
      - "Looks good. Ship."
