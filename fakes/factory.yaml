# Fake behavior for graphs/factory.yaml. It shows the contract gate with a real
# contract, a send-back round (the architect writes a revised contract), parallel
# work (store and api run at the same time), a retry (api fails once), and both gates.
default:
  duration: 3s

nodes:
  standards:
    duration: 2s
    logs:
      - render AGENTS.md (ponytail, go 1.27 guidelines, orwell)
      - write .factory/standards/lock.json

  architect:
    duration: 6s
    tests: 12
    red: 12
    logs:
      - read spec.md
      - write acceptance tests (12)
      - "contract: 12 tests, 12 fail on the stubs (the full file is CONTRACT.md)"
    contract: |
      # Contract: records CLI

      ## Unclear in the spec

      - **Empty query.** The spec does not say what `query ""` returns. The tests expect `ErrEmpty`.
      - **Key case.** The spec does not say if keys are case-sensitive. The tests treat `A` and `a` as two keys.
      - **Missing key.** `get` of a key that is not stored: the tests expect exit code 1 and `not found` on stderr.

      ## Packages and interfaces

      | Package | What it does |
      |---|---|
      | `internal/store` | `Put(key, value string) error` and `Get(key string) (string, error)` |
      | `internal/api` | `ParseQuery(q string) (Query, error)` |
      | `cmd/cli` | `run(args []string, stdin io.Reader, stdout, stderr io.Writer) int` |

      ## What the tests check

      12 tests. Each one fails on the stubs.

      1. `TestPutGet`: a stored record comes back.
      2. `TestGetMissing`: a missing key gives `ErrNotFound`.
      3. `TestParseQuery/empty_input`: an empty query gives `ErrEmpty`.

      ```go
      func ParseQuery(q string) (Query, error)
      ```
    revised: |
      # Contract: records CLI

      ## Unclear in the spec

      - **Empty query.** An empty query returns every record. The tests expect no error.
      - **Key case.** The spec does not say if keys are case-sensitive. The tests treat `A` and `a` as two keys.
      - **Missing key.** `get` of a key that is not stored: the tests expect exit code 1 and `not found` on stderr.

      ## Packages and interfaces

      | Package | What it does |
      |---|---|
      | `internal/store` | `Put(key, value string) error` and `Get(key string) (string, error)` |
      | `internal/api` | `ParseQuery(q string) (Query, error)` |
      | `cmd/cli` | `run(args []string, stdin io.Reader, stdout, stderr io.Writer) int` |

      ## What the tests check

      12 tests. Each one fails on the stubs.

      1. `TestPutGet`: a stored record comes back.
      2. `TestGetMissing`: a missing key gives `ErrNotFound`.
      3. `TestParseQuery/empty_input`: an empty query matches every record.

      ```go
      func ParseQuery(q string) (Query, error)
      ```

  plan:
    duration: 4s
    logs:
      - split the contract into packages
      - check write scopes do not overlap
    emit:
      - id: pkg-store
        title: internal/store
        kind: agent
        scope: [internal/store]
        retries: 2
      - id: pkg-api
        title: internal/api
        kind: agent
        scope: [internal/api]
        retries: 2
      - id: cmd-cli
        title: cmd/cli
        kind: agent
        scope: [cmd/cli]
        retries: 2
        deps: [pkg-store, pkg-api]

  pkg-store:
    duration: 7s
    logs:
      - implement Store.Put and Store.Get
      - go test ./internal/store - ok
      - go fix -diff - clean

  pkg-api:
    duration: 5s
    fail_attempts: 1
    error: "check failed: TestParseQuery/empty_input: got nil error, want ErrEmpty"
    logs:
      - implement ParseQuery
      - go test ./internal/api

  cmd-cli:
    duration: 5s
    logs:
      - wire flags to store and api
      - go build ./... - ok

  verify:
    duration: 3s
    logs:
      - go test -race ./... - ok
      - go.mod says go 1.27, no unapproved modules

  review:
    duration: 4s
    logs:
      - "What this change does: a CLI that stores and queries records."
      - "Looks good. Ship."
