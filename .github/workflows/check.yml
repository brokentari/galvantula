name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The sandbox sees only /usr and runs Go from /usr/bin, as in docker/Dockerfile.
      - name: Set up the sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap redis-tools
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo cp -a "$(go env GOROOT)" /usr/local/go-ci
          sudo ln -sf /usr/local/go-ci/bin/go /usr/local/go-ci/bin/gofmt /usr/bin/
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: GOFLAGS=-buildvcs=false go fix -diff ./...
      - run: go test -race ./...

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
