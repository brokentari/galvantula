# Settings `factory serve` reads when it starts, and stores with each run.
# Restart the server after you change them.
# See Software Factory Plan.html.
go:
  version: "1.27" # the go line in each product's go.mod; also filters the Go guidelines

# Tell every agent to keep its replies short. Files it writes are not affected.
concise_output: true

# Spending and time limits. A node that reaches its limit fails that attempt.
budget:
  node_usd: 3        # most one agent attempt may spend
  run_usd: 12        # at this, the runtime starts no new node
  node_minutes: 20   # wall-clock limit for one agent attempt
  replans: 2         # times a run may replace a failed task with a new plan
  revisions: 2       # times a person may send a rejected contract back to the architect

# Which model plays each role, and how hard it thinks. The eval author writes
# the hidden tests that judge the factory, so it must be a model the factory
# does not use for anything else.
models:
  architect:   { model: claude-sonnet-5-5, effort: high } # runs once; a wrong test it writes cannot be fixed later
  planner:     { model: claude-sonnet-5-5, effort: medium }
  implementer: { model: claude-sonnet-5-5, effort: medium }
  reviewer:    { model: claude-sonnet-5-5, effort: medium }
  eval_author: { model: claude-opus-5-5,   effort: xhigh }
