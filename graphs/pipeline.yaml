# The factory without a planner: one implementer does all the work. The standards node
# puts the rules and the spec on main. The architect writes the interfaces,
# the acceptance tests and CONTRACT.md; its tests must fail on its stubs. You
# approve that contract at the gate. The implementer fills in the stubs and
# may not change the tests. The review is advisory, and so is the fix that
# answers it: the tests decide the outcome. Verify runs the whole suite with
# the race detector on what is on main.
name: pipeline
nodes:
  - id: standards
    title: Write AGENTS.md, spec.md and go.mod
    kind: tool
    role: standards

  - id: architect
    title: Interfaces, stubs, acceptance tests, CONTRACT.md
    kind: agent
    role: architect
    deps: [standards]
    retries: 2

  - id: approve-contract
    title: Approve the contract
    kind: gate
    deps: [architect]

  - id: implement
    title: Fill in the stubs and pass the tests
    kind: agent
    role: implementer
    deps: [approve-contract]
    retries: 2

  - id: review
    title: ponytail-review, advisory
    kind: agent
    role: reviewer
    advisory: true
    deps: [implement]

  - id: fix
    title: Answer the review findings, if any
    kind: agent
    role: fixer
    advisory: true
    deps: [review]
    retries: 1

  - id: verify
    title: Whole suite with -race
    kind: tool
    role: verify
    deps: [fix]
