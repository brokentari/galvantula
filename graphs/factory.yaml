# The full factory. After you approve the contract, the planner reads it and
# writes a task graph: one task per group of packages, each with a scope (the
# package directories it may write) and its deps. You approve that task graph
# and its cost ceiling at the second gate. The runtime puts the tasks where
# the "tasks" slot is. Tasks with no dependency between them run at the same
# time, each in its own worktree, and the runtime merges each one into main
# when its check passes. Scopes do not overlap, so the merges cannot conflict.
# The review, fix and verify nodes then see the whole product.
#
# When a task fails its last retry, the runtime removes it and the tasks that
# depend on it, and runs the planner again for their packages. The other tasks
# stay. Each replan is a new version of this graph. budget.replans in
# guardrails.yaml limits replans; past it, a failed task fails the run.
name: factory
nodes:
  - id: standards
    title: Write AGENTS.md, spec.md and go.mod
    kind: tool
    role: standards

  - id: architect
    title: Interfaces, stubs, acceptance tests, CONTRACT.md
    kind: agent
    role: architect
    deps: [standards]
    retries: 2

  - id: approve-contract
    title: Approve the contract
    kind: gate
    deps: [architect]

  - id: plan
    title: Split the work into tasks
    kind: plan
    role: planner
    deps: [approve-contract]
    retries: 2

  - id: approve-tasks
    title: Approve the task graph and its cost
    kind: gate
    deps: [plan]

  - id: tasks
    title: Generated task graph
    kind: slot
    filled_by: plan
    deps: [approve-tasks]

  - id: review
    title: ponytail-review, advisory
    kind: agent
    role: reviewer
    advisory: true
    deps: [tasks]

  - id: fix
    title: Answer the review findings, if any
    kind: agent
    role: fixer
    advisory: true
    deps: [review]
    retries: 1

  - id: verify
    title: Whole suite with -race
    kind: tool
    role: verify
    deps: [fix]
